about:
  title: "About Me"
  description: |
    Full-stack developer and data scientist based in Kenya, blending an analytical mindset with a passion for building seamless, high-performing digital experiences. Skilled in Laravel for robust backends and APIs, Vue, Nuxt, and React for dynamic web interfaces, and Flutter for polished mobile apps. Driven by curiosity, clean architecture, and a love for development that turns ideas into intelligent, data-informed solutions.

