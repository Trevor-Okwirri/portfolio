faq:
  title: "Frequently Asked Questions"
  description: "Answers to common questions about my work and process."
  categories:
    - title: "Services & Process"
      questions:
        - label: "What services do you offer?"
          content: |
            I specialize in full-stack web and mobile development using Laravel, Vue, Nuxt, React, and Flutter. I also integrate data analytics into applications to help teams make informed, data-driven decisions.
        - label: "Do you work remotely?"
          content: |
            Yes — I’ve successfully worked with both local and international teams, including a remote role with an Indian SaaS company.
        - label: "Do you take freelance projects?"
          content: |
            Absolutely. I collaborate with startups and growing businesses to design and develop custom applications that are fast, scalable, and user-friendly.
    - title: "About Me"
      questions:
        - label: "What do you enjoy most about development?"
          content: |
            I enjoy transforming complex problems into simple, elegant solutions that feel effortless to users. I love how development challenges me to think both creatively and logically.
        - label: "What inspires your work?"
          content: |
            The intersection of technology, data, and design — creating systems that not only work well but make a real impact.
